<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutor Dashboard - SlotSync</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="container nav-content">
      <a href="#" class="nav-brand">SlotSync</a>
      <div class="nav-user">
        <span class="role-badge">Tutor</span>
        <span id="user-name-display" style="font-weight: 500;"></span>
        <button class="btn btn-outline" id="logout-btn" style="padding: 6px 12px; font-size: 0.85rem;">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container">
    <!-- Profile Metrics Card -->
    <div class="mb-md" style="background: var(--bg-color); padding: var(--space-md); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); display: flex; gap: var(--space-lg); align-items: center; flex-wrap: wrap;">
      <div>
        <h2 style="margin: 0; font-size: 1.2rem;">Welcome back, <span id="tutor-name-profile">Tutor</span>!</h2>
      </div>
      <div style="display: flex; gap: var(--space-lg); margin-left: auto; text-align: center;">
        <div>
          <span style="color: var(--text-muted); display: block; font-size: 0.8rem; text-transform: uppercase;">Rating</span>
          <strong id="profile-rating" style="font-size: 1.1rem;">--</strong>
        </div>
        <div>
          <span style="color: var(--text-muted); display: block; font-size: 0.8rem; text-transform: uppercase;">Hours Taught</span>
          <strong id="profile-hours" style="font-size: 1.1rem;">--</strong>
        </div>
        <div>
          <span style="color: var(--text-muted); display: block; font-size: 0.8rem; text-transform: uppercase;">Subjects</span>
          <strong id="profile-subjects" style="font-size: 1.1rem;">--</strong>
        </div>
      </div>
    </div>

    <div class="dashboard-header">
      <div>
        <h1>Manage Availability</h1>
        <p class="mt-sm">Click on empty slots to mark them as available. Click again to remove availability.</p>
      </div>
      <div class="dashboard-stats">
        <div class="stat-pill">
          Available: <strong id="stat-available">0</strong>
        </div>
        <div class="stat-pill">
          Booked: <strong id="stat-booked">0</strong>
        </div>
      </div>
    </div>

    <!-- Calendar Controls -->
    <div class="mb-md" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-md);">
      <h2>Availability Schedule</h2>
      <div style="display: flex; gap: var(--space-sm); align-items: center;">
        <label for="tutor-capacity-setting" style="font-size: 0.9rem; color: var(--text-muted);">Max Students per Slot:</label>
        <input type="number" id="tutor-capacity-setting" min="1" max="10" value="1" style="width: 60px; padding: 4px; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
      </div>
      <div style="display: flex; gap: var(--space-sm); align-items: center;">
        <button class="btn btn-outline" id="prev-week-btn" style="padding: 4px 12px;">&lt; Prev</button>
        <strong id="week-label" style="min-width: 140px; text-align: center;">This Week</strong>
        <button class="btn btn-outline" id="next-week-btn" style="padding: 4px 12px;">Next &gt;</button>
      </div>
    </div>

    <!-- Calendar Grid -->
    <div class="calendar-container">
      <!-- Header -->
      <div class="calendar-header" id="calendar-header">
        <div class="calendar-day-header">Time</div>
        <!-- Days will be generated by JS -->
      </div>
      
      <!-- Body -->
      <div class="calendar-body" id="calendar-body">
        <!-- Time Labels Col -->
        <div class="calendar-time-labels" id="time-labels">
          <!-- Times will be generated by JS -->
        </div>
        
        <!-- Day Columns will be generated by JS -->
      </div>
    </div>

    <!-- My Bookings Section -->
    <div class="mb-lg mt-lg">
      <h2>My Confirmed Bookings</h2>
      <div id="my-bookings-container" class="mt-md">
        <!-- Bookings will be rendered here -->
      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/tutor.js"></script>
</body>
</html>
