<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - SlotSync</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  
  <nav class="navbar">
    <div class="container nav-content">
      <a href="#" class="nav-brand">SlotSync</a>
      <div class="nav-user">
        <span class="role-badge">Student</span>
        <span id="user-name-display" style="font-weight: 500;"></span>
        <button class="btn btn-outline" id="logout-btn" style="padding: 6px 12px; font-size: 0.85rem;">Logout</button>
      </div>
    </div>
  </nav>

  
  <main class="container">
    <div class="dashboard-header mb-md" style="display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-md); flex-wrap: wrap;">
      <div>
        <h1 class="nav-brand">Student Dashboard</h1>
        <p>Welcome back, <span id="student-name-profile">Student</span>!</p>
      </div>
      
      
      <div class="profile-card" style="background: var(--bg-color); padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); display: flex; gap: var(--space-md); font-size: 0.9rem;">
        <div>
          <span style="color: var(--text-muted); display: block; font-size: 0.8rem; text-transform: uppercase;">Attendance</span>
          <strong id="profile-attendance">--</strong>
        </div>
        <div>
          <span style="color: var(--text-muted); display: block; font-size: 0.8rem; text-transform: uppercase;">Hours Learned</span>
          <strong id="profile-hours">--</strong>
        </div>
      </div>
    </div>

    <div class="dashboard-header">
      <div>
        <h1>Find a Tutor</h1>
        <p class="mt-sm">Browse available slots across all tutors. Click a slot to book immediately.</p>
      </div>
      <div class="dashboard-stats">
        <div class="stat-pill">
          Weekly Requests: <strong id="stat-requests">0 / 3</strong>
        </div>
      </div>
    </div>

    
    <div class="mb-lg">
      <div class="browse-tutors-header">
        <h2>Browse Tutors</h2>
        <div style="display: flex; gap: var(--space-sm); align-items: center;">
          <input type="text" id="tutor-search" placeholder="Search by subject..." style="max-width: 200px;">
          <select id="tutor-filter" style="max-width: 200px;">
            <option value="all">All Tutors</option>
          </select>
        </div>
      </div>
      <div id="tutor-cards-container" class="tutor-cards-container">
        
      </div>
    </div>

    
    <div class="mb-md" style="display: flex; justify-content: space-between; align-items: center;">
      <h2 style="font-size: 1.5rem;">Select a Slot</h2>
      <div style="display: flex; gap: var(--space-sm); align-items: center;">
        <button class="btn btn-outline" id="prev-week-btn" style="padding: 4px 12px;">&lt; Prev</button>
        <strong id="week-label" style="min-width: 140px; text-align: center;">This Week</strong>
        <button class="btn btn-outline" id="next-week-btn" style="padding: 4px 12px;">Next &gt;</button>
      </div>
    </div>

    
    <div class="calendar-container">
      
      <div class="calendar-header" id="calendar-header">
        <div class="calendar-day-header">Time</div>
        
      </div>
      
      
      <div class="calendar-body" id="calendar-body">
        
        <div class="calendar-time-labels" id="time-labels">
          
        </div>
        
        
      </div>
    </div>

    
    <div class="mb-lg mt-lg">
      <h2>My Confirmed Bookings</h2>
      <div id="my-bookings-container" class="mt-md">
        
      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
